    h1 {

      color: #ffffff;
    }
    p {

      color: #94a3b8;

      background: #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;

    }
    .controles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 15px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      box-sizing: border-box;

      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

      color: #f1f5f9;
      font-size: 11px;
      font-weight: 600;

    }
    button.ativo {

      border-color: #0ea5e9;

    .grelha {

      gap: 16px;
    }

      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

    .card.aguardar { border-left: 4px solid #f59e0b; }
    .card.evitar { border-left: 4px solid #ef4444; }

      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
    }

      color: #94a3b8;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      margin-left: 6px;

      color: #94a3b8;
      margin-top: 2px;

      { t: "MSTR", n: "MicroStrategy", s: "Cripto", tipo: "ACUMULATIVO", p: "$245.00", pe: "65.0", dec: "AGUARDAR", av: "CARO", pot: "MUITO POTENCIAL", nota: "Ação altamente alavancada à Bitcoin." }
    ];

    function filtrarSinal(f, elemento) {
      sinalAtivo = f;
      document.querySelectorAll('.filtros button').forEach(b => b.classList.remove('ativo'));
      if(elemento) elemento.classList.add('ativo');
      renderizar();
    }

    function renderizar() {
      const setorSelecionado = document.getElementById("filtroSetor").value;
      const termo = document.getElementById("pesquisa").value.toLowerCase();
      const grelha = document.getElementById("grelha");
      grelha.innerHTML = "";

      const filtrados = ativos.filter(a => {
        const matchSetor = setorSelecionado === "TODOS" || a.s === setorSelecionado;
        const matchTermo = a.t.toLowerCase().includes(termo) || a.n.toLowerCase().includes(termo);
        
        let matchSinal = true;
        if (sinalAtivo === "COMPRAR") matchSinal = a.dec === "COMPRAR";
        else if (sinalAtivo === "MUITO_BARATO") matchSinal = a.av === "MUITO BARATO";
        else if (sinalAtivo === "BARATO") matchSinal = a.av === "BARATO";
        else if (sinalAtivo === "ACUMULATIVO") matchSinal = a.tipo === "ACUMULATIVO";
        else if (sinalAtivo === "DIVIDENDOS") matchSinal = a.tipo === "DIVIDENDOS";

        return matchSetor && matchTermo && matchSinal;
      });

      if (filtrados.length === 0) {
        grelha.innerHTML = `<p style="color: #94a3b8; grid-column: 1/-1; text-align: center; padding: 40px;">Nenhum ativo encontrado com estes filtros.</p>`;
        return;
      }

      filtrados.forEach(a => {
        let classeCard = "aguardar";
        if (a.dec === "COMPRAR") classeCard = "comprar";
        if (a.dec === "NÃO COMPRAR") classeCard = "evitar";

        const classeDec = a.dec === "COMPRAR" ? "comprar" : (a.dec === "AGUARDAR" ? "aguardar" : "evitar");
        const classeTipo = a.tipo === "ACUMULATIVO" ? "acumulativo" : "dividendos";

        grelha.innerHTML += `
          <div class="card ${classeCard}">
            <div>
              <div class="card-header">
                <div>
                  <span class="ticker">${a.t}</span>
                  <span class="setor">${a.s}</span>
                  <div class="nome">${a.n}</div>
                </div>
                <span class="badge-decisao ${classeDec}">${a.dec}</span>
              </div>
              <span class="badge-tipo ${classeTipo}">${a.tipo}</span>
              <div class="info-box">
                <span>Preço: <strong style="color: #ffffff;">${a.p}</strong></span>
                <span>Avaliação: <strong style="color: #38bdf8;">${a.av}</strong></span>
              </div>
              <div class="nota">${a.nota}</div>
            </div>
            <div class="card-footer">
              <span>P/E: <strong style="color: #e2e8f0;">${a.pe}</strong></span>
              <span>Potencial: <strong style="color: #e2e8f0;">${a.pot}</strong></span>
            </div>
          </div>
        `;
      });
    }

    setInterval(() => {
      segundosRestantes--;
      if (segundosRestantes <= 0) {
        segundosRestantes = 120;
        renderizar();
      }
      const min = String(Math.floor(segundosRestantes / 60)).padStart(2, '0');
      const seg = String(segundosRestantes % 60).padStart(2, '0');
      document.getElementById("contador").innerText = `${min}:${seg}`;
    }, 1000);

    renderizar();
  </script>
</body>
</html>
